[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envcad"
version = "1.5"
description = "集成 text-to-cad / multiCAD-mcp 的机械与环保工程制图插件（国标 DXF 引擎 + COM 桥接）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "凹凸cad小助手（二集）" }]
dependencies = [
    "ezdxf>=1.3",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Engineering",
    "Topic :: Scientific/Engineering :: CAD",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/你的用户名/凹凸CAD小助手"
Repository = "https://github.com/你的用户名/凹凸CAD小助手"
Documentation = "https://github.com/你的用户名/凹凸CAD小助手/blob/main/USAGE.md"

[project.optional-dependencies]
cad = ["pywin32"]            # multiCAD-mcp COM 桥接（AutoCAD/ZWCAD）
doc = ["openpyxl", "python-docx"]   # 文档自动化层（DOCX 说明书 / XLSX 清单）
all = ["pywin32", "openpyxl", "python-docx"]

[project.scripts]
envcad = "envcad.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["envcad*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.csv", "*.txt"]
