functions:
  fan_elevation: "draw_fan_elevation"
  fan_plan: "draw_fan_plan"
  fan_section: "draw_fan_section"
  fan_flange: "draw_fan_flange"
  fan_base: "draw_fan_base"
  fan_installation: "draw_fan_installation"
