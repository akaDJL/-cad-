# 领域配置: duct（风管系统多视图）
# 由 auto_registry 自动扫描加载。
# 成套出图（A/B/C）推荐：envcad equip duct --level B --air_flow 50000

name: "duct"
module: "envcad.standards.duct"
description: "风管系统多视图（平面/立面/弯头/三通/变径/支吊架）"
functions:
  duct_plan: "draw_duct_plan"
  duct_elevation: "draw_duct_elevation"
  duct_elbow: "draw_duct_elbow"
  duct_tee: "draw_duct_tee"
  duct_reducer: "draw_duct_reducer"
  duct_hanger: "draw_duct_hanger"
