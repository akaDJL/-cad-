description: "氧化沟多视图（平面/横剖面/转刷曝气机/出水堰门/推流器）"
functions:
  od_plan: "draw_od_plan"
  od_section: "draw_od_section"
  od_brush: "draw_od_brush"
  od_weir: "draw_od_weir"
  od_pusher: "draw_od_pusher"
